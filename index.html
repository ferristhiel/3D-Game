<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mecha-Blade: Horizon | Enhanced Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; user-select: none; color: #fff; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* Main Menu */
        #main-menu { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #001a1a, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }
        h1 { color: #00ffff; text-shadow: 0 0 20px #00ffff; font-size: 3rem; margin-bottom: 10px; }
        .menu-btn { background: rgba(0, 255, 255, 0.1); border: 2px solid #00ffff; color: #00ffff; padding: 15px 40px; margin: 10px; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; cursor: pointer; transition: 0.3s; width: 300px; text-transform: uppercase; }
        .menu-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 30px #00ffff; }

        /* HUD */
        #hud { display: none; }
        .panel { position: absolute; background: rgba(0, 20, 30, 0.8); border: 1px solid rgba(0, 255, 255, 0.3); padding: 15px; }
        
        /* Compass */
        #compass-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 400px; height: 40px; background: rgba(0,0,0,0.5); overflow: hidden; border-bottom: 2px solid #00ffff; }
        #compass-ribbon { position: absolute; width: 2000px; height: 100%; display: flex; align-items: center; transition: transform 0.1s linear; font-size: 0.9rem; color: #00ffff; letter-spacing: 15px; padding-left: 200px; }
        #compass-needle { position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: #ff0055; box-shadow: 0 0 10px #ff0055; }

        /* Minimap */
        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 180px; border: 2px solid #00ffff; border-radius: 50%; overflow: hidden; background: rgba(0,0,0,0.7); }
        #minimap-canvas { width: 100%; height: 100%; }

        /* Stats & Quest */
        #stats-panel { bottom: 20px; left: 20px; width: 250px; border-left: 4px solid #ff0055; }
        #quest-panel { top: 70px; right: 20px; width: 220px; border-right: 4px solid #00ffff; text-align: right; }
        
        .bar-container { width: 100%; height: 8px; background: #222; margin: 10px 0; }
        .hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.3s; }
    </style>
</head>
<body>

    <div id="main-menu">
        <h1>MECHA-BLADE</h1>
        <p style="color: #00ffff; opacity: 0.5;">v1.0.0 // PROTOCOL: HORIZON</p>
        <button class="menu-btn" onclick="GameApp.startNewGame()">Neues Spiel</button>
        <button class="menu-btn" id="btn-continue" onclick="GameApp.loadGame()" disabled>Fortsetzen</button>
        <button class="menu-btn" onclick="alert('Multiplayer-Modus erfordert Peer-Server-Verbindung.')">Multiplayer (LAN)</button>
    </div>

    <div id="ui-layer">
        <div id="hud">
            <div id="compass-container">
                <div id="compass-ribbon">N --- NE --- E --- SE --- S --- SW --- W --- NW --- N --- NE --- E --- SE --- S</div>
                <div id="compass-needle"></div>
            </div>

            <div id="quest-panel" class="panel">
                <div style="font-size: 0.6rem; color: #00ffff;">MISSION LOG</div>
                <div id="quest-desc" style="font-size: 0.8rem; font-weight: bold;">Initialisiere...</div>
                <div id="quest-dist" style="font-size: 0.7rem; color: yellow;">Distanz: ---</div>
            </div>

            <div id="stats-panel" class="panel">
                <div style="font-size: 0.8rem; display: flex; justify-content: space-between;">
                    <span>MECHA-UNIT-01</span>
                    <span id="coords">0, 0</span>
                </div>
                <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
                <div id="time-display" style="font-size: 0.7rem; color: #00ffff;">08:00</div>
            </div>

            <div id="minimap-container">
                <canvas id="minimap-canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

        const CONFIG = {
            worldSize: 600,
            walkableRadius: 200,
            maxHeight: 80,
            dayDuration: 300 // 5 Minuten ein Tag
        };

        class App {
            constructor() {
                this.isRunning = false;
                this.keys = {};
                this.noise = new SimplexNoise();
                this.questTarget = new THREE.Vector3(120, 0, -120);
                this.time = 0;
                
                this.init();
            }

            init() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                document.body.appendChild(this.renderer.domElement);

                this.setupLights();
                this.generateWorld();
                this.setupControls();

                // Minimap Canvas Setup
                this.minimapCanvas = document.getElementById('minimap-canvas');
                this.minimapCtx = this.minimapCanvas.getContext('2d');
                this.minimapCanvas.width = 180;
                this.minimapCanvas.height = 180;

                window.addEventListener('resize', () => this.onResize());
                
                // Savegame Check
                if(localStorage.getItem('mecha_save')) {
                    document.getElementById('btn-continue').disabled = false;
                }
            }

            setupLights() {
                this.sun = new THREE.DirectionalLight(0xffffff, 1);
                this.sun.position.set(50, 100, 50);
                this.sun.castShadow = true;
                this.sun.shadow.camera.left = -300;
                this.sun.shadow.camera.right = 300;
                this.sun.shadow.camera.top = 300;
                this.sun.shadow.camera.bottom = -300;
                this.scene.add(this.sun);
                
                this.ambient = new THREE.AmbientLight(0x4040ff, 0.3);
                this.scene.add(this.ambient);
                this.scene.fog = new THREE.FogExp2(0x001a1a, 0.005);
            }

            getHeight(x, z) {
                let y = this.noise.noise(x * 0.01, z * 0.01) * 8;
                const dist = Math.sqrt(x*x + z*z);
                const edge = Math.max(0, (dist - CONFIG.walkableRadius) / (CONFIG.worldSize/2 - CONFIG.walkableRadius));
                y += Math.pow(edge, 3) * CONFIG.maxHeight;
                return y;
            }

            generateWorld() {
                const geo = new THREE.PlaneGeometry(CONFIG.worldSize, CONFIG.worldSize, 100, 100);
                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const z = pos.getY(i);
                    pos.setZ(i, this.getHeight(x, z));
                }
                geo.computeVertexNormals();
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x112222, 
                    flatShading: true,
                    roughness: 0.8
                });
                const ground = new THREE.Mesh(geo, mat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Quest Relikt Visualisierung
                const relicGeo = new THREE.OctahedronGeometry(2);
                const relicMat = new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00ffff});
                this.relic = new THREE.Mesh(relicGeo, relicMat);
                this.questTarget.y = this.getHeight(this.questTarget.x, this.questTarget.z) + 3;
                this.relic.position.copy(this.questTarget);
                this.scene.add(this.relic);
            }

            setupControls() {
                window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
                window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
                window.addEventListener('keydown', e => {
                    if(e.key === "Escape") this.saveAndQuit();
                });
            }

            startNewGame() {
                this.player = {
                    mesh: new THREE.Group(),
                    hp: 100,
                    velocity: new THREE.Vector3()
                };
                const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0x888888}));
                body.position.y = 1;
                this.player.mesh.add(body);
                this.scene.add(this.player.mesh);
                
                this.startGame();
            }

            saveAndQuit() {
                const save = {
                    pos: this.player.mesh.position.toArray(),
                    hp: this.player.hp,
                    time: this.time
                };
                localStorage.setItem('mecha_save', JSON.stringify(save));
                location.reload();
            }

            loadGame() {
                const data = JSON.parse(localStorage.getItem('mecha_save'));
                this.startNewGame();
                this.player.mesh.position.fromArray(data.pos);
                this.player.hp = data.hp;
                this.time = data.time;
            }

            startGame() {
                this.isRunning = true;
                document.getElementById('main-menu').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                this.animate();
            }

            updateUI() {
                // Time
                this.time += 0.01;
                const hours = Math.floor((this.time / CONFIG.dayDuration) * 24) % 24;
                const mins = Math.floor(((this.time / CONFIG.dayDuration) * 1440) % 60);
                document.getElementById('time-display').innerText = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;

                // Stats
                document.getElementById('coords').innerText = `${Math.round(this.player.mesh.position.x)}, ${Math.round(this.player.mesh.position.z)}`;
                document.getElementById('hp-bar').style.width = this.player.hp + '%';

                // Compass
                const camDir = new THREE.Vector3();
                this.camera.getWorldDirection(camDir);
                const angle = Math.atan2(camDir.x, camDir.z) * (180 / Math.PI);
                document.getElementById('compass-ribbon').style.transform = `translateX(${-angle * 2.2}px)`;

                // Quest
                const dist = this.player.mesh.position.distanceTo(this.questTarget);
                document.getElementById('quest-desc').innerText = "Finde das Relikt";
                document.getElementById('quest-dist').innerText = `Distanz: ${Math.round(dist)}m`;

                // Minimap
                this.drawMinimap();
            }

            drawMinimap() {
                const ctx = this.minimapCtx;
                ctx.clearRect(0,0,180,180);
                
                // Background Circle
                ctx.fillStyle = "rgba(0, 255, 255, 0.1)";
                ctx.beginPath(); ctx.arc(90, 90, 85, 0, Math.PI*2); ctx.fill();

                const scale = 0.5; // Zoom Faktor
                const centerX = 90;
                const centerY = 90;

                // Player (Center)
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(centerX-2, centerY-2, 4, 4);

                // Quest Target relative to player
                const relX = (this.questTarget.x - this.player.mesh.position.x) * scale;
                const relZ = (this.questTarget.z - this.player.mesh.position.z) * scale;
                
                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.arc(centerX + relX, centerY + relZ, 3, 0, Math.PI*2);
                ctx.fill();
            }

            animate() {
                if(!this.isRunning) return;
                requestAnimationFrame(() => this.animate());

                const dt = 0.016;

                // Player Movement
                const speed = this.keys['shift'] ? 15 : 7;
                if(this.keys['a']) this.player.mesh.rotation.y += 3 * dt;
                if(this.keys['d']) this.player.mesh.rotation.y -= 3 * dt;

                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(this.player.mesh.quaternion);
                if(this.keys['w']) this.player.mesh.position.add(dir.multiplyScalar(speed * dt));
                if(this.keys['s']) this.player.mesh.position.add(dir.multiplyScalar(-speed * 0.5 * dt));

                this.player.mesh.position.y = this.getHeight(this.player.mesh.position.x, this.player.mesh.position.z);

                // Camera follow
                const offset = new THREE.Vector3(0, 5, 10).applyQuaternion(this.player.mesh.quaternion);
                this.camera.position.lerp(this.player.mesh.position.clone().add(offset), 0.1);
                this.camera.lookAt(this.player.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)));

                // Relic Animation
                this.relic.rotation.y += dt;
                this.relic.position.y += Math.sin(Date.now()*0.005)*0.01;

                this.updateUI();
                this.renderer.render(this.scene, this.camera);
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        const GameApp = new App();
        window.GameApp = GameApp;
    </script>
</body>
</html>
